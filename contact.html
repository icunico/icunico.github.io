    nav ul li a {

      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 600px;

      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 480px;
    }

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border-radius: 8px;
      text-decoration: none;
      color: #2c3e50;
      border: 2px solid #2c3e50;
      font-weight: bold;
      font-size: 1.05rem;
      transition: all 0.3s ease;

      color: #1abc9c;
      border-color: #1abc9c;
